name: Przebuduj wygląd poradnika

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/przebuduj-poradnik.yml"
      - "tools/przebuduj_poradnik.py"

permissions:
  contents: write

concurrency:
  group: przebudowa-poradnika
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Utwórz punkt przywracania
        shell: bash
        run: |
          BACKUP_TAG="backup-przed-przebudowa-${GITHUB_RUN_ID}"
          git tag "$BACKUP_TAG"
          git push origin "$BACKUP_TAG"
          echo "Utworzono punkt przywracania: $BACKUP_TAG"

      - name: Ujednolić nagłówek, menu i stopkę
        run: python3 tools/przebuduj_poradnik.py --root .

      - name: Kontrola wyniku
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import sys

          excluded_files = {
              "404.html",
              "FRAGMENT_DO_HEAD.html",
          }

          files = list(Path(".").rglob("*.html"))
          checked = 0
          bad = []

          for path in files:
              if ".git" in path.parts:
                  continue

              if path.name in excluded_files:
                  print(f"Pominięto plik techniczny: {path}")
                  continue

              checked += 1
              content = path.read_text(
                  encoding="utf-8",
                  errors="ignore",
              )

              has_header = 'class="site-header az-header"' in content
              has_footer = 'class="footer az-footer"' in content

              if not has_header or not has_footer:
                  bad.append(str(path))

          print(f"Skontrolowano: {checked} plików HTML")
          print(f"Pliki bez wspólnego nagłówka lub stopki: {len(bad)}")

          if bad:
              print("\n".join(bad[:50]))
              sys.exit(1)
          PY

      - name: Zapisz przebudowę w repozytorium
        shell: bash
        run: |
          git config user.name "A-Z Biuro Automation"
          git config user.email "azbiuro.pl@gmail.com"
          git add --all

          if git diff --cached --quiet; then
            echo "Brak zmian do zapisania."
            exit 0
          fi

          git commit -m "Ujednolicenie wyglądu poradnik.eazbiuro.pl"
          git push origin "HEAD:${GITHUB_REF_NAME}"
